services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MAGAZYNIER_DB: /data/magazyn.db
      # Klucz LLM — nieużywany w tracerze (karta 01); włączy go parser LLM (karta 02).
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
