[project]
name = "magazynier-backend"
version = "0.1.0"
description = "MAGAZYNIER — backend FastAPI + SQLite (tracer bullet: tekst → karta zmiany → confirm → baza + audyt)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
